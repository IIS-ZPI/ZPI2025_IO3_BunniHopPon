This is a solid start for your CI/CD pipeline. To meet your requirements perfectly, we need to add a second job that depends on lint-and-test passing, handles the React build, increments the version starting from 2.0.0, and creates the GitHub release.
A Quick Note on "Pull Requests" vs. "Merges"

Your requirement states: "każdy pull request wykonany na branch release... ma generować nowe otagowane wydanie" (every PR made to the release branch... should generate a new tagged release).

In GitHub Actions standard practices, you generally don't want to create a release while a PR is still open (as subsequent commits would create duplicate releases). The best practice is to run your tests while the PR is open, and then generate the release when the PR is merged. Merging a PR into release counts as a push event to the release branch. I have configured the trigger exactly this way to keep your repository clean.

Here is your updated, complete pipeline.yml:
YAML

name: CI Pipeline

on:
  push:
    branches:
      - main
      - release
      - develop
  pull_request:
    branches:
      - main
      - release
      - develop

# Required to allow the workflow to create tags and releases
permissions:
  contents: write

jobs:
  lint-and-test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  build-and-release:
    name: Build and Create Release
    needs: lint-and-test # Ensures this only runs if lint and tests pass
    # Runs ONLY on the release branch, and ONLY after the PR is merged (a push event)
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch all history and tags for auto-versioning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Zip build directory
        # Vite outputs to the 'dist' directory by default. 
        # We zip it to attach it as our executable artifact.
        run: zip -r app-build.zip dist/

      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 2.0.0 # Fulfils the requirement to start from 2.0.0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          files: app-build.zip
          generate_release_notes: true

Key Additions Explained:

    permissions: contents: write: Added at the top level. Without this, GitHub's default security token won't have the permissions required to push the new version tag or publish the release.

    needs: lint-and-test: This binds the two jobs together. If any test or linting rule fails in the first job, the build and release job is entirely skipped.

    fetch-depth: 0: When checking out the code in the release job, we fetch all history. The tag action needs to scan the repository's previous tags to figure out what the next version should be.

    anothrNick/github-tag-action: This action intelligently looks at your previous tags and automatically bumps the version. Passing INITIAL_VERSION: 2.0.0 ensures your very first automated release adheres strictly to your prompt's versioning requirement.

    softprops/action-gh-release: This creates the official GitHub release page, uses standard AI-generated release notes (generate_release_notes: true) based on merged PRs, and attaches your zipped React dist/ folder as a downloadable artifact.

can we not do the ziping? Can we just publish the html, js and css files

Yes, we can definitely skip the zip file! However, I need to be completely honest with you about how GitHub Releases work, as it will affect how we do this.

Vite builds your React app into a dist/ folder, placing the index.html at the root and your compiled JS/CSS inside an assets/ subfolder. GitHub Releases do not support folder structures for attached files. If we tell the release action to attach the raw files, it will flatten everything into a messy list of individual files on the release page, completely breaking the connections between your HTML and your JS/CSS.

Because your original requirement states you must "realizować wdrożenie lub dołączać wykonywalną formę" (realize a deployment OR attach an executable form), the best way to "publish" raw HTML/JS/CSS files is to fulfill the deployment half of that requirement.

We can do this by having the pipeline automatically deploy those built files to GitHub Pages while still generating your 2.0.0+ tagged release.

Here is the updated pipeline. It creates the Release (for version tracking) and publishes the live files directly to GitHub Pages.
Updated pipeline.yml
YAML

name: CI Pipeline

on:
  push:
    branches:
      - main
      - release
      - develop
  pull_request:
    branches:
      - main
      - release
      - develop

# Required permissions for Releases and GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint-and-test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  build-release-deploy:
    name: Release and Deploy
    needs: lint-and-test
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build React App
        run: npm run build
      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 2.0.0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          generate_release_notes: true
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
